services:
  agent:
    build: .
    working_dir: /app
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - agent-data:/app/data
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env before starting Docker}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REMOTE_MEMORY: ${REMOTE_MEMORY:-false}
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  hindsight:
    profiles: ["memory"]
    image: ghcr.io/vectorize-io/hindsight:latest
    ports: ["127.0.0.1:8888:8888", "127.0.0.1:9999:9999"]
    environment:
      HINDSIGHT_API_LLM_PROVIDER: groq
      HINDSIGHT_API_LLM_API_KEY: ${GROQ_API_KEY:-}
      HINDSIGHT_API_LLM_MODEL: ${PRIMARY_MODEL:-openai/gpt-oss-120b}
    volumes: ["hindsight-data:/home/hindsight/.pg0"]
volumes:
  agent-data:
  hindsight-data:
